name: Dataform Compilation Dry Run

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  dataform-compile-dryrun:
    if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != '' && vars.DATAFORM_REPO_PATH != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Compile Dataform repository via REST API
        env:
          DATAFORM_REPO_PATH: ${{ vars.DATAFORM_REPO_PATH }}
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repo_path = os.environ["DATAFORM_REPO_PATH"].strip().strip("/")
          if not re.fullmatch(
              r"projects/[A-Za-z0-9-]+/locations/[A-Za-z0-9-]+/repositories/[A-Za-z0-9_-]+",
              repo_path,
          ):
              raise SystemExit(f"Invalid DATAFORM_REPO_PATH: {repo_path!r}")

          token = os.environ["GCP_ACCESS_TOKEN"].strip()
          if not token:
              raise SystemExit("Missing GCP_ACCESS_TOKEN from google-github-actions/auth.")

          git_commitish = (
              os.environ.get("GITHUB_HEAD_REF")
              or os.environ.get("GITHUB_REF_NAME")
              or "main"
          )

          url = f"https://dataform.googleapis.com/v1/{repo_path}/compilationResults"
          payload = json.dumps({"gitCommitish": git_commitish}).encode("utf-8")
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              error_body = exc.read().decode("utf-8", errors="replace")
              print(f"Dataform compilation API failed (HTTP {exc.code}): {error_body}", file=sys.stderr)
              raise SystemExit(1) from exc

          print(f"Compilation result: {result.get('name', '<unknown>')}")
          print(f"Resolved commit SHA: {result.get('resolvedGitCommitSha', '<unknown>')}")
          print(f"Dataform Core version: {result.get('dataformCoreVersion', '<unknown>')}")

          errors = result.get("compilationErrors") or []
          if errors:
              print(f"Dataform returned {len(errors)} compilation error(s):", file=sys.stderr)
              for err in errors:
                  path = err.get("path", "<unknown>")
                  message = err.get("message", "<no error message>")
                  print(f"  - {path}: {message}", file=sys.stderr)
              raise SystemExit(1)

          print("Dataform compilation succeeded with zero errors.")
          EOF
